schema_version: 1
reconstruction:
  selected_graphs: spec/selected_graphs.tsv
  feature_columns: spec/feature_columns.tsv
  label_columns: spec/label_columns.tsv
  identifier_decisions: spec/identifier_decisions.tsv
  node_order:
    method: cpython27_string_dict
    word_size_bits: 64
    hash_randomization: false
    keep_entrez_ids_as_strings: true
  features:
    source_version: MSigDB 6.1
    collections:
    - C1
    - C3
    minimum_source_members: 200
    threshold_operator: '>='
    maximum_columns: 50
    preserve_gmt_order: true
    project_after_selection: true
  labels:
    goa_release: 159
    evidence_codes:
    - EXP
    - IDA
    - IEP
    - IGI
    - IMP
    - ISS
    exclude_not: true
    allowed_relations:
      biological_process: involved_in
      cellular_component: part_of
      molecular_function: enables
    excluded_relations:
    - colocalizes_with
    - contributes_to
    canonicalize_alt_ids: true
    propagation_relations:
    - is_a
    term_selection: top_121_by_full_human_prevalence
  graphsage:
    include_unsupervised_walks: false
  dgl:
    fit_standard_scaler_on: training_rows_only
    feature_computation_dtype: float64
    directed_edge_expansion: true
    one_self_loop_per_node: true
